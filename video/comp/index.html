<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Wayfare exhibition video</title>
<style>
  @font-face { font-family: Poppins; font-weight: 400; src: url(../../node_modules/@fontsource/poppins/files/poppins-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Poppins; font-weight: 600; src: url(../../node_modules/@fontsource/poppins/files/poppins-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: Poppins; font-weight: 700; src: url(../../node_modules/@fontsource/poppins/files/poppins-latin-700-normal.woff2) format('woff2'); }
  :root { --paper:#fff; --ink:#050505; --muted:#5c5c66; --blue:#548cff; --wash:#eef3ff; --sun:#fec93b; --lilac:#c8b7ee; --blush:#f4b5c8; --sage:#a6d6b0; --hair:#e4e4ea; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
  body { font-family: Poppins, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--paper); }
  .scene { position: absolute; inset: 0; overflow: hidden; will-change: transform, opacity; }
  .abs { position: absolute; }
  .grid { position: absolute; inset: -40px; opacity: .55; }
  .ink { background: var(--ink); color: #fff; }
  .h1 { font-weight: 700; font-size: 84px; line-height: 1.04; letter-spacing: -1.5px; }
  .h2 { font-weight: 700; font-size: 64px; line-height: 1.08; letter-spacing: -1px; }
  .h3 { font-weight: 700; font-size: 44px; line-height: 1.12; }
  .body { font-size: 30px; line-height: 1.45; color: var(--muted); font-weight: 400; }
  .over { font-size: 20px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 8px 22px; border-radius: 999px; font-weight: 600; font-size: 24px; }
  .w { display: inline-block; will-change: transform, opacity, filter; }
  .accent { color: var(--blue); }
  .pillwrap { position: relative; display: inline-block; padding: 0 28px 10px; }
  .pillbg { position: absolute; inset: 0; background: var(--blue); border-radius: 999px; transform-origin: left center; }
  .pilltx { position: relative; }
  .phone { position: absolute; width: 420px; height: 886px; background: var(--ink); border-radius: 66px; padding: 10px; box-shadow: 0 40px 120px rgba(5,5,5,.18), 0 0 0 0 rgba(84,140,255,0); }
  .screen { position: relative; width: 400px; height: 866px; border-radius: 56px; overflow: hidden; background: #fff; }
  .screen img { position: absolute; left: 0; top: 0; width: 400px; height: auto; }
  .notch { position: absolute; left: 50%; top: 14px; width: 110px; height: 30px; margin-left: -55px; background: var(--ink); border-radius: 20px; z-index: 3; }
  .callout { position: absolute; border: 4px solid var(--blue); border-radius: 22px; box-shadow: 0 0 0 6px rgba(84,140,255,.18), 0 0 40px rgba(84,140,255,.45); }
  .clabel { position: absolute; white-space: nowrap; background: var(--ink); color: #fff; font-weight: 600; font-size: 26px; padding: 12px 24px; border-radius: 999px; box-shadow: 0 12px 30px rgba(5,5,5,.2); }
  .cline { position: absolute; height: 3px; background: var(--blue); transform-origin: left center; }
  .laptop { position: absolute; }
  .lscreen { position: relative; background: var(--ink); padding: 18px; border-radius: 28px 28px 8px 8px; }
  .lscreen .view { position: relative; overflow: hidden; border-radius: 10px; background: #fff; }
  .lscreen img { position: absolute; left: 0; top: 0; width: 100%; height: auto; }
  .lbase { height: 26px; background: #1b1b20; border-radius: 0 0 26px 26px; margin: 0 -60px; }
  .card { background: #fff; border: 3px solid var(--ink); border-radius: 32px; padding: 36px; }
  .icon svg { width: 100%; height: 100%; display: block; }
  .tag { position: absolute; font-size: 18px; font-weight: 600; color: var(--muted); background: #fff; border: 2px solid var(--hair); padding: 6px 14px; border-radius: 999px; }
  #grain { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; opacity: .055; mix-blend-mode: multiply; z-index: 50; }
  #chrome { position: absolute; inset: 0; pointer-events: none; z-index: 40; }
  .toast { position: absolute; left: 18px; right: 18px; background: #fff; border: 3px solid var(--ink); border-radius: 26px; padding: 18px 22px; font-weight: 600; font-size: 21px; box-shadow: 0 18px 40px rgba(5,5,5,.18); z-index: 5; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs id="filters"></defs></svg>
<div id="stage"></div>
<div id="chrome"></div>
<canvas id="grain" width="480" height="270"></canvas>
<script src="icons.js"></script>
<script src="boxes.js"></script>
<script src="comp.js"></script>
</body>
</html>
